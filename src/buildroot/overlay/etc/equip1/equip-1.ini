# Equip-1 user settings. Environment variables with matching EQUIP1_ names
# still override these values for development and one-off debugging.

[lights]
enabled = true
default_colors = 0,0,255;0,0,255;0,0,255
brightness = 0.25

[network]
ap_ssid = Equip-1
ap_password = firesecret

[recording]
capture_dir = /data/captures
storage_label = EQUIP1
normalize_dif_headers = 1
auto_convert_mp4 = true
mp4_quality = high
mp4_deinterlace = true
auto_storage_switch = true

[hdmi]
enabled = true

[ui]
board_type = rock2f
oled_fps = 8

[power]
# Optional PiSugar 3/3 Plus battery status. When pisugar-server is absent or
# the socket is unavailable, the daemon reports power.available=false and the
# OLED UI hides the battery indicator.
pisugar_enabled = true
pisugar_socket = /tmp/pisugar-server.sock
pisugar_poll_interval = 5
pisugar_timeout = 0.075

[logging]
# quiet, error, warning, info, or debug. Use quiet for production silence;
# debug also enables verbose debug/performance logs.
log_level = debug
