# Equip-1 user settings. Environment variables with matching EQUIP1_ names
# still override these values for development and one-off debugging.

[lights]
enabled = true
default_colors = 0,0,255;0,0,255;0,0,255
brightness = 0.25

[network]
wifi_mode = ap
host = 0.0.0.0
port = 8000
ap_enabled = true
ap_iface = wlan0
ap_ssid = Equip-1
ap_password = firesecret
ap_ip = 10.42.0.1
ap_cidr = 24
ap_channel = 6
ap_dhcp_start = 10.42.0.10
ap_dhcp_end = 10.42.0.100
ap_dhcp_lease = 12h
ap_country =
captive_port = 80
# Start Wi-Fi in parallel so recorder/OLED/HDMI are not blocked by AP init.
startup_background = true

[recording]
capture_dir = /data/captures
auto_storage_switch = true
auto_storage_cooldown_seconds = 5
storage_label = EQUIP1
data_mount = /data
data_mount_options = noatime
data_mount_timeout = 15
# Do not block boot waiting for optional USB recording storage; the daemon can
# auto-switch to USB later when one appears.
usb_data_wait_seconds = 0
data_boot_diagnostics = false

[preview]
fps = 25
size = 720:540
quality = 4
recording_fps = 2
recording_size = 480:360
recording_quality = 5

[hdmi]
enabled = true
stream_url = http://127.0.0.1:8000/api/stream.mkv?takeover=1
fbdev = /dev/fb0
poll_seconds = 1
assume_connected_without_drm = false
# Leave blank to infer from /sys/class/graphics/fb*/bits_per_pixel.
pix_fmt =
ffmpeg_loglevel = info
# Set true temporarily when debugging; it logs ffmpeg frame counters every few seconds.
ffmpeg_progress = false
ffmpeg_stats_period = 5
clear_on_connect = true

[ui]
api_base = http://127.0.0.1:8000/api
api_timeout = 5.0
state_fetch_interval = 1.0
boot_duration_seconds = 3.0
boot_hold_seconds = 1.1
oled_fps = 30

[logging]
# quiet, error, warning, info, or debug. Use quiet for production silence;
# debug also enables verbose debug/performance logs.
log_level = info

[performance]
storage_snapshot_ttl = 0.75
captures_cache_ttl = 2.0
